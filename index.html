<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>千十三 | 心に少しだけ余白を。</title>

  <meta
    name="description"
    content="千十三の活動や作品などをまとめた公式サイトです。"
  >

  <style>
    :root {
      --bg: #f8fbfc;
      --text: #343957;
      --sub: #747c91;
      --accent: #aebfd6;
      --accent-light: #edf3f7;
      --line: #e1e8ed;
      --white: #fdfcfd;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        "Meiryo",
        sans-serif;
      font-size: 16px;
      line-height: 1.9;
      letter-spacing: 0.03em;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    /* =========================
       Header / First View
    ========================= */

    .hero {
      max-width: 760px;
      margin: 0 auto;
      padding: 90px 24px 70px;
      text-align: center;
    }

    .hero-name {
      margin: 0 0 24px;
      font-size: 30px;
      font-weight: 500;
      letter-spacing: 0.12em;
    }

    .hero-copy {
      margin: 0;
      font-size: 24px;
      font-weight: 400;
      letter-spacing: 0.08em;
    }

    .hero-message {
      margin: 24px 0 32px;
      color: var(--sub);
      font-size: 15px;
      line-height: 2;
    }

    /* =========================
       SNS
    ========================= */

    .sns {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 18px;
      margin: 0 auto 45px;
    }

    .sns-link {
      display: flex;
      justify-content: center;
      align-items: center;

      width: 44px;
      height: 44px;

      border: 1px solid var(--line);
      border-radius: 50%;

      background: rgba(255, 255, 255, 0.7);

      color: var(--text);
      font-size: 13px;
      letter-spacing: 0;

      transition:
        background-color 0.2s ease,
        border-color 0.2s ease,
        transform 0.2s ease;
    }

    .sns-link:hover {
      background: var(--accent-light);
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    /* =========================
       Navigation
    ========================= */

    .nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 28px;
    }

    .nav a {
      color: var(--sub);
      font-size: 13px;
      letter-spacing: 0.12em;
    }

    .nav a:hover {
      color: var(--text);
    }

    /* =========================
       Main
    ========================= */

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 24px 80px;
    }

    section {
      padding: 70px 0;
      border-top: 1px solid var(--line);
    }

    .section-label {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.16em;
    }

    h2 {
      margin: 0 0 25px;
      font-size: 23px;
      font-weight: 500;
      letter-spacing: 0.06em;
    }

    section p {
      margin: 0;
      color: var(--sub);
      font-size: 16px;
    }

    /* =========================
       About
    ========================= */

    .about-message {
      margin-top: 25px;
      padding: 20px 24px;
      border-left: 3px solid var(--accent);
      background: rgba(238, 231, 245, 0.45);
      color: var(--text);
      font-size: 15px;
    }

    /* =========================
       Works
    ========================= */

    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-top: 30px;
    }

    .card {
      padding: 25px 22px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #f3edf4;
      transition:
        transform 0.2s ease,
        border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .card-title {
      margin: 0 0 6px;
      font-size: 16px;
      font-weight: 500;
    }

    .card-text {
      margin: 0;
      color: var(--sub);
      font-size: 14px;
    }

    /* =========================
       Content
    ========================= */

    .content-links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 30px;
    }

    .content-link {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 17px 20px;

      border: 1px solid var(--line);
      border-radius: 10px;

      background: var(--white);
      font-size: 15px;

      transition:
        background-color 0.2s ease,
        border-color 0.2s ease;
    }

    .content-link:hover {
      background: var(--accent-light);
      border-color: var(--accent);
    }

    .arrow {
      color: var(--accent);
    }

    /* =========================
       Contact
    ========================= */

    .contact-box {
      margin-top: 30px;
      padding: 30px 25px;
      border-radius: 12px;
      background: var(--accent-light);
      text-align: center;
    }

    .contact-box p {
      margin-bottom: 20px;
      color: var(--text);
    }

    .contact-button {
      display: inline-block;
      padding: 10px 24px;
      border-radius: 999px;
      background: var(--white);
      font-size: 14px;
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .contact-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(70, 60, 90, 0.08);
    }

    /* =========================
       Footer
    ========================= */

    footer {
      padding: 35px 24px 45px;
      border-top: 1px solid var(--line);
      text-align: center;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 18px;
    }

    .footer-links a {
      color: var(--sub);
      font-size: 13px;
    }

    .copyright {
      margin: 0;
      color: #9699aa;
      font-size: 12px;
    }

    /* =========================
       Mobile
    ========================= */

    @media (max-width: 600px) {

      .hero {
        padding: 70px 20px 55px;
      }

      .hero-name {
        font-size: 26px;
      }

      .hero-copy {
        font-size: 20px;
      }

      .hero-message {
        font-size: 14px;
      }

      .sns {
        gap: 14px;
        margin-bottom: 38px;
      }

      .sns-link {
        width: 42px;
        height: 42px;
      }

      .nav {
        gap: 18px;
      }

      .nav a {
        font-size: 12px;
      }

      main {
        padding: 0 20px 60px;
      }

      section {
        padding: 55px 0;
      }

      h2 {
        font-size: 21px;
      }

      section p {
        font-size: 15px;
      }

      .cards {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>


<body>

  <!-- =========================
       First View
  ========================= -->

  <header class="hero">

    <p class="hero-name">千十三</p>

    <!-- SNS -->

    <nav class="sns" aria-label="SNS">

      <!-- URLはあとで変更 -->
      <a
        class="sns-link"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="X"
        title="X"
      >
        𝕏
      </a>

      <a
        class="sns-link"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="YouTube"
        title="YouTube"
      >
        ▶
      </a>

      <a
        class="sns-link"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="note"
        title="note"
      >
        note
      </a>

    </nav>


    <!-- Site Navigation -->

    <nav class="nav" aria-label="サイト内ナビゲーション">
      <a href="#about">ABOUT</a>
      <a href="#works">WORKS</a>
      <a href="#content">CONTENT</a>
      <a href="#contact">CONTACT</a>
    </nav>

  </header>


  <main>

    <!-- =========================
         Contact
    ========================= -->

    <section id="contact">

      <p class="section-label">CONTACT</p>

      <h2>お問い合わせ</h2>

      <div class="contact-box">

        <p>
          お仕事・コラボレーション・その他のお問い合わせはこちらから。
        </p>

        <a href="/contact/" class="contact-button">
          CONTACT →
        </a>

      </div>

    </section>

  </main>


  <!-- =========================
       Footer
  ========================= -->

  <footer>

    <nav class="footer-links" aria-label="フッターナビゲーション">
      <a href="/guidelines/">ファン活動・創作ガイドライン</a>
      <a href="/contact/">CONTACT</a>
    </nav>

    <p class="copyright">
      © 千十三
    </p>

  </footer>


</body>
</html>
